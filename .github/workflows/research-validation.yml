name: JESI Research Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jesi-research-validation
  cancel-in-progress: false

jobs:
  research-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69e3e2e5f3f9f8b3f7b6e6f0a0b8d4d0f4e # v5.6.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Python path
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Validate syntax
        run: |
          python -m compileall -q scripts src

      - name: Indicator redundancy
        run: |
          python scripts/44_analyze_indicator_redundancy.py

      - name: Normalization sensitivity
        run: |
          python scripts/45_normalization_sensitivity.py

      - name: Weight sensitivity
        run: |
          python scripts/46_weight_sensitivity.py

      - name: Aggregation sensitivity
        run: |
          python scripts/47_aggregation_sensitivity.py

      - name: Historical validation
        run: |
          python scripts/48_historical_validation.py

      - name: Balanced-panel sensitivity
        run: |
          python scripts/50_balanced_panel_sensitivity.py

      - name: Verify production repository unchanged
        run: |
          git status --short
          git diff --exit-code

          echo "Production repository remained unchanged."

      - name: Research validation summary
        run: |
          echo "=================================================="
          echo "JESI RESEARCH VALIDATION COMPLETED"
          echo "=================================================="
          echo "44 - Indicator Redundancy:      COMPLETE"
          echo "45 - Normalization Sensitivity: COMPLETE"
          echo "46 - Weight Sensitivity:        COMPLETE"
          echo "47 - Aggregation Sensitivity:   COMPLETE"
          echo "48 - Historical Validation:     COMPLETE"
          echo "50 - Balanced Panel:             COMPLETE"
          echo "Production JESI modification:   NONE"
          echo "Production reweighting:         NONE"
          echo "Imputation:                     NONE"
          echo "=================================================="
