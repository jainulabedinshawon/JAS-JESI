name: Validate JESI Growth Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-growth-data:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Growth data
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/01_download_growth_data.py

      - name: Validate Growth data
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/02_validate_growth_data.py

      - name: Construct Growth pillar
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/03_construct_growth_pillar.py

      - name: Display Growth pillar output
        run: |
          set -euo pipefail
          echo "Growth pillar file:"
          ls -lh data/raw/growth_pillar_2015_2025.csv

          echo
          echo "First rows:"
          head -20 data/raw/growth_pillar_2015_2025.csv

      - name: Upload Growth pillar dataset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jesi-growth-pillar-2015-2025
          if-no-files-found: error
          path: data/raw/growth_pillar_2015_2025.csv
