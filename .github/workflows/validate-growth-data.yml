name: Validate JESI Growth Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-growth-data:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Growth data
        run: |
          PYTHONPATH=. python scripts/02_validate_growth_data.py
