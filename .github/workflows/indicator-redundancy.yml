name: Indicator Redundancy Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redundancy-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run indicator redundancy analysis
        run: |
          python scripts/44_analyze_indicator_redundancy.py

      - name: Verify redundancy outputs
        run: |
          test -f data/results/jesi_indicator_redundancy_pairwise.csv
          test -f data/results/jesi_indicator_redundancy_missingness.csv
          test -f data/results/jesi_indicator_redundancy_pillar_summary.csv
          test -f data/results/jesi_indicator_redundancy_report.md

      - name: Display analysis summary
        run: |
          echo "=== Indicator Redundancy Analysis Completed ==="
          echo
          echo "--- Pillar Summary ---"
          cat data/results/jesi_indicator_redundancy_pillar_summary.csv
          echo
          echo "--- Pairwise Results ---"
          cat data/results/jesi_indicator_redundancy_pairwise.csv

      - name: Upload redundancy analysis outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jesi-indicator-redundancy-analysis
          path: |
            data/results/jesi_indicator_redundancy_pairwise.csv
            data/results/jesi_indicator_redundancy_missingness.csv
            data/results/jesi_indicator_redundancy_pillar_summary.csv
            data/results/jesi_indicator_redundancy_report.md
