name: Dashboard Smoke Test

on:
  pull_request:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - "data/results/**"
      - "tests/test_dashboard_smoke.py"
      - ".github/workflows/dashboard-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dashboard/requirements.txt
          python -m pip install pytest

      - name: Verify source CSV files
        run: |
          test -s data/results/final_jesi_country_results.csv
          test -s data/results/jesi_country_year_2016_2023.csv

      - name: Run dashboard smoke test
        run: |
          python -m pytest -q tests/test_dashboard_smoke.py