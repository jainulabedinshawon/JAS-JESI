name: Build JESI Connectivity Pillar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity-pillar:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Connectivity data
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/05_download_connectivity_data.py

      - name: Validate Connectivity data
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/06_validate_connectivity_data.py

      - name: Construct Connectivity pillar
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/07_construct_connectivity_pillar.py

      - name: Display Connectivity output
        run: |
          set -euo pipefail
          echo "Connectivity pillar file:"
          ls -lh data/raw/connectivity_pillar_2015_2024.csv

          echo
          echo "First rows:"
          head -20 data/raw/connectivity_pillar_2015_2024.csv

      - name: Upload Connectivity dataset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jesi-connectivity-pillar-2015-2024
          if-no-files-found: error
          path: data/raw/connectivity_pillar_2015_2024.csv
