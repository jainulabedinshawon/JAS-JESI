name: Build JESI Connectivity Pillar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity-pillar:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Connectivity data
        run: |
          PYTHONPATH=. python scripts/05_download_connectivity_data.py

      - name: Validate Connectivity data
        run: |
          PYTHONPATH=. python scripts/06_validate_connectivity_data.py

      - name: Construct Connectivity pillar
        run: |
          PYTHONPATH=. python scripts/07_construct_connectivity_pillar.py

      - name: Display Connectivity output
        run: |
          echo "Connectivity pillar file:"
          ls -lh data/raw/connectivity_pillar_2015_2024.csv

          echo
          echo "First rows:"
          head -20 data/raw/connectivity_pillar_2015_2024.csv

      - name: Upload Connectivity dataset
        uses: actions/upload-artifact@v4
        with:
          name: jesi-connectivity-pillar-2015-2024
          path: data/raw/connectivity_pillar_2015_2024.csv
