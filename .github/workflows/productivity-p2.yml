name: Validate JESI Productivity P2 Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  productivity-p2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Productivity P2 data
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/16_download_productivity_p2.py

      - name: Validate Productivity P2 data
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/17_validate_productivity_p2.py

      - name: Analyze Productivity P2 distribution
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/18_analyze_productivity_p2_distribution.py

      - name: Upload Productivity P2 outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jesi-productivity-p2-pipeline-output
          if-no-files-found: error
          path: |
            data/raw/productivity_p2_tfp_growth_2015_2023.csv
            data/processed/productivity_p2_pooled_descriptive_statistics.csv
            data/processed/productivity_p2_country_statistics.csv
            data/processed/productivity_p2_pooled_percentiles.csv
            data/processed/productivity_p2_country_year_extremes.csv
            data/processed/productivity_p2_candidate_reference_zones.csv
