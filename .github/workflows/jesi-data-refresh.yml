name: JESI Scheduled Data Refresh

on:
  workflow_dispatch:

  schedule:
    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: jesi-data-refresh
  cancel-in-progress: false

jobs:
  refresh-and-validate:
    name: Refresh and Validate Research Data
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Record refresh metadata
        run: |
          set -euo pipefail
          mkdir -p data/refresh_audit

          python - <<'PY'
          import json
          import os
          import platform
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          metadata = {
              "project": "JAS-JESI",
              "workflow": "JESI Scheduled Data Refresh",
              "started_at_utc": datetime.now(
                  timezone.utc
              ).isoformat(),
              "python_version": sys.version,
              "platform": platform.platform(),
              "git_commit": os.environ.get(
                  "GITHUB_SHA", "unknown"
              ),
              "run_id": os.environ.get(
                  "GITHUB_RUN_ID", "unknown"
              ),
              "run_attempt": os.environ.get(
                  "GITHUB_RUN_ATTEMPT", "unknown"
              ),
              "baseline_modified_automatically": False,
          }

          Path(
              "data/refresh_audit/refresh_metadata.json"
          ).write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )

          print(json.dumps(metadata, indent=2))
          PY

      - name: Download resilience data
        run: |
          set -euo pipefail
          python scripts/08_download_resilience_data.py

      - name: Validate resilience data
        run: |
          set -euo pipefail
          python scripts/09_validate_resilience_data.py

      - name: Analyze resilience distribution
        run: |
          set -euo pipefail
          python scripts/10_analyze_resilience_distribution.py

      - name: Download Strategic Autonomy data
        run: |
          set -euo pipefail
          python scripts/29_download_autonomy_data.py

      - name: Download UNCTAD import concentration data
        run: |
          set -euo pipefail
          python scripts/31_download_import_concentration.py

      - name: Verify UNCTAD output
        run: |
          set -euo pipefail
          test -s data/raw/import_product_concentration_2015_2024.csv

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path(
              "data/raw/import_product_concentration_2015_2024.csv"
          )
          df = pd.read_csv(path)

          if len(df) != 50:
              raise SystemExit(
                  f"Expected 50 observations; found {len(df)}"
              )

          required = {
              "country",
              "country_code",
              "year",
              "import_product_concentration",
          }
          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  f"Missing required columns: {sorted(missing)}"
              )

          if df[["country_code", "year"]].isna().any().any():
              raise SystemExit(
                  "Country code/year contains missing values"
              )

          if df.duplicated(["country_code", "year"]).any():
              raise SystemExit(
                  "Duplicate country-year observations detected"
              )

          expected_countries = {
              "BGD", "IND", "VNM", "IDN", "MYS"
          }
          expected_years = set(range(2015, 2025))

          if set(df["country_code"]) != expected_countries:
              raise SystemExit(
                  "Country coverage does not match expected sample"
              )

          years = pd.to_numeric(df["year"], errors="coerce")

          if years.isna().any() or set(years.astype(int)) != expected_years:
              raise SystemExit(
                  "Year coverage does not match 2015-2024"
              )

          values = pd.to_numeric(
              df["import_product_concentration"],
              errors="coerce",
          )

          if values.isna().any():
              raise SystemExit(
                  "Import concentration contains missing/invalid values"
              )

          if ((values < 0) | (values > 1)).any():
              raise SystemExit(
                  "Import concentration outside [0, 1]"
              )

          print("UNCTAD output verification: PASSED")
          print(f"Observations: {len(df)}")
          PY

      # Step 30: integrate the two official-source datasets.
      - name: Integrate Strategic Autonomy data
        run: |
          set -euo pipefail
          python scripts/30_validate_autonomy_data.py
          test -s data/raw/autonomy_indicators_2015_2024_complete.csv

      # Step 32: validate coverage and report missing observations.
      - name: Validate Strategic Autonomy coverage
        run: |
          set -euo pipefail
          python scripts/32_validate_autonomy_data.py

      # Step 33: produce distribution diagnostics.
      - name: Analyze Strategic Autonomy distribution
        run: |
          set -euo pipefail
          python scripts/33_analyze_autonomy_distribution.py

      # Step 34: score only complete observations.
      # Missing official-source values must not be imputed.
      - name: Score Strategic Autonomy indicators
        run: |
          set -euo pipefail
          python scripts/34_score_autonomy.py

          test -s data/processed/autonomy_indicator_scores_2015_2024.csv
          test -s data/processed/strategic_autonomy_excluded_observations_2015_2024.csv

      # Step 35: construct the pillar from validated scores.
      - name: Construct Strategic Autonomy pillar
        run: |
          set -euo pipefail
          python scripts/35_construct_autonomy_pillar.py

          test -s data/processed/strategic_autonomy_pillar_2015_2024.csv
          test -s data/processed/strategic_autonomy_country_summary_2015_2024.csv

      - name: Analyze Strategic Autonomy coverage
        run: |
          set -euo pipefail
          python scripts/43_analyze_autonomy_coverage.py

          test -s data/processed/strategic_autonomy_coverage_summary_2015_2024.csv

      - name: Verify autonomy scoring outputs
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          files = [
              Path("data/raw/autonomy_indicators_2015_2024.csv"),
              Path("data/raw/import_product_concentration_2015_2024.csv"),
              Path("data/raw/autonomy_indicators_2015_2024_complete.csv"),
              Path("data/processed/autonomy_indicator_scores_2015_2024.csv"),
              Path("data/processed/strategic_autonomy_excluded_observations_2015_2024.csv"),
              Path("data/processed/strategic_autonomy_pillar_2015_2024.csv"),
              Path("data/processed/strategic_autonomy_country_summary_2015_2024.csv"),
              Path("data/processed/strategic_autonomy_coverage_summary_2015_2024.csv"),
          ]

          for path in files:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty output: {path}")

              print(f"Verified: {path} ({path.stat().st_size} bytes)")

          base = pd.read_csv(
              "data/raw/autonomy_indicators_2015_2024.csv"
          )
          complete = pd.read_csv(
              "data/raw/autonomy_indicators_2015_2024_complete.csv"
          )
          scored = pd.read_csv(
              "data/processed/autonomy_indicator_scores_2015_2024.csv"
          )
          excluded = pd.read_csv(
              "data/processed/strategic_autonomy_excluded_observations_2015_2024.csv"
          )
          pillar = pd.read_csv(
              "data/processed/strategic_autonomy_pillar_2015_2024.csv"
          )

          if len(base) != 50 or len(complete) != 50:
              raise SystemExit("Expected 50 base and integrated observations")

          keys = ["country_code", "year"]

          for name, frame in [
              ("base", base),
              ("integrated", complete),
              ("scored", scored),
              ("excluded", excluded),
              ("pillar", pillar),
          ]:
              if frame.duplicated(keys).any():
                  raise SystemExit(f"Duplicate country-year keys in {name}")

          if len(scored) + len(excluded) != len(complete):
              raise SystemExit(
                  "Scored plus excluded rows do not equal integrated rows"
              )

          if set(map(tuple, scored[keys].to_numpy())) & set(
              map(tuple, excluded[keys].to_numpy())
          ):
              raise SystemExit(
                  "A country-year appears in both scored and excluded outputs"
              )

          score_columns = [
              "eci_score",
              "high_tech_exports_score",
              "import_product_concentration_score",
          ]

          missing_score_columns = set(score_columns) - set(scored.columns)
          if missing_score_columns:
              raise SystemExit(
                  f"Missing score columns: {sorted(missing_score_columns)}"
              )

          for column in score_columns:
              values = pd.to_numeric(scored[column], errors="coerce")

              if values.isna().any():
                  raise SystemExit(f"Missing/invalid scored values: {column}")

              if ((values < 0) | (values > 1)).any():
                  raise SystemExit(f"Scores outside [0, 1]: {column}")

          if scored[score_columns].isna().any().any():
              raise SystemExit("Missing values found in scored indicator output")

          if pillar[score_columns].isna().any().any():
              raise SystemExit("Missing indicator scores in pillar output")

          if len(pillar) != len(scored):
              raise SystemExit(
                  "Pillar row count does not match scored observations"
              )

          if set(map(tuple, pillar[keys].to_numpy())) != set(
              map(tuple, scored[keys].to_numpy())
          ):
              raise SystemExit(
                  "Pillar country-year keys do not match scored observations"
              )

          print()
          print(f"Integrated observations: {len(complete)}")
          print(f"Scored observations: {len(scored)}")
          print(f"Excluded observations: {len(excluded)}")
          print("Scoring output verification: PASSED")
          PY

      - name: Verify resilience and refresh outputs
        run: |
          set -euo pipefail

          test -s data/raw/resilience_indicators_2015_2024.csv
          test -s data/processed/strategic_autonomy_coverage_summary_2015_2024.csv

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          files = [
              Path("data/raw/resilience_indicators_2015_2024.csv"),
              Path("data/processed/strategic_autonomy_coverage_summary_2015_2024.csv"),
          ]

          for path in files:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty output: {path}")

              pd.read_csv(path)
              print(f"Verified: {path}")

          print("Refresh output verification: PASSED")
          PY

      - name: Record successful validation
        if: success()
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(
              "data/refresh_audit/refresh_metadata.json"
          )
          metadata = json.loads(
              path.read_text(encoding="utf-8")
          )

          metadata["completed_at_utc"] = datetime.now(
              timezone.utc
          ).isoformat()
          metadata["validation_status"] = "passed"
          metadata["baseline_modified_automatically"] = False
          metadata["autonomy_pipeline"] = [
              "30_validate_autonomy_data.py",
              "32_validate_autonomy_data.py",
              "33_analyze_autonomy_distribution.py",
              "34_score_autonomy.py",
              "35_construct_autonomy_pillar.py",
          ]

          path.write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )

          print("Refresh audit metadata finalized.")
          PY

      - name: Upload refresh and audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jesi-data-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/refresh_audit/refresh_metadata.json
            data/raw/resilience_indicators_2015_2024.csv
            data/raw/autonomy_indicators_2015_2024.csv
            data/raw/autonomy_indicators_2015_2024_complete.csv
            data/raw/import_product_concentration_2015_2024.csv
            data/processed/autonomy_indicator_scores_2015_2024.csv
            data/processed/strategic_autonomy_excluded_observations_2015_2024.csv
            data/processed/strategic_autonomy_pillar_2015_2024.csv
            data/processed/strategic_autonomy_country_summary_2015_2024.csv
            data/processed/strategic_autonomy_coverage_summary_2015_2024.csv
            data/processed/autonomy_pooled_descriptive_statistics.csv
            data/processed/autonomy_country_statistics.csv
            data/processed/autonomy_pooled_percentiles.csv
            data/processed/autonomy_candidate_reference_zones.csv
            data/processed/autonomy_country_year_extremes.csv
