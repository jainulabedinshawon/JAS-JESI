name: Final JESI Pipeline

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/**"
      - "src/**"
      - ".github/workflows/final-jesi.yml"
      - "requirements.txt"
      - "requirements.lock"

# ==============================================================
# GLOBAL SECURITY
# ==============================================================
# No repository write permission is granted globally.
# The computational job receives read-only access.
# The separate commit job receives write access only when required.

permissions:
  contents: read

concurrency:
  group: final-jesi-pipeline
  cancel-in-progress: false

jobs:

  # ==============================================================
  # MAIN JESI COMPUTATION + VALIDATION
  # ==============================================================

  final-jesi:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # ============================================================
      # RECORD SOURCE COMMIT
      # ============================================================

      - name: record workflow source commit
        run: |
          echo "JESI_SOURCE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "JESI_SOURCE_SHA=${GITHUB_SHA}"
          echo "JESI_SOURCE_REF=${GITHUB_REF}"
          echo "JESI_SOURCE_REPOSITORY=${GITHUB_REPOSITORY}"

      # ============================================================
      # PYTHON
      # ============================================================

      - name: set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.lock

      # ============================================================
      # DEPENDENCIES
      # ==============================================================

      - name: install reviewed hash-locked dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          test -s requirements.txt || {
            echo "ERROR: requirements.txt is missing or empty."
            exit 1
          }

          test -s requirements.lock || {
            echo "ERROR: requirements.lock is missing or empty."
            exit 1
          }

          python -m pip install --require-hashes -r requirements.lock
          python -m pip check

          echo "Hash-locked dependency installation: PASSED"

      # ==============================================================
      # PYTHON PATH
      # ==============================================================

      - name: configure python path
        run: |
          set -euo pipefail
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: verify python environment
        run: |
          set -euo pipefail
          python --version
          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import numpy; print('numpy:', numpy.__version__)"
          python -c "import scipy; print('scipy:', scipy.__version__)"
          python -c "import openpyxl; print('openpyxl:', openpyxl.__version__)"
          python -c "import src; print('src package import: OK')"

      # ==============================================================
      # PYTHON SYNTAX VALIDATION
      # ==============================================================

      - name: validate python syntax
        run: |
          set -euo pipefail
          python -m compileall -q scripts src
          echo "Python syntax validation: PASSED"

      # ==============================================================
      # TEST SUITE
      # ==============================================================

      - name: run jesi test suite
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest

      # ==============================================================
      # GROWTH
      # ==============================================================

      - name: score growth indicators
        run: |
          set -euo pipefail
          python scripts/27_score_growth.py

      - name: construct growth pillar
        run: |
          set -euo pipefail
          python scripts/28_construct_growth_pillar.py

      # ==============================================================
      # PRODUCTIVITY P1
      # ==============================================================

      - name: download productivity p1 data
        run: |
          set -euo pipefail
          python scripts/12_download_productivity_data.py

      - name: score productivity p1
        run: |
          set -euo pipefail
          python scripts/15_score_productivity_p1.py

      # ==============================================================
      # PRODUCTIVITY P2
      # ==============================================================

      - name: download productivity p2 data
        run: |
          set -euo pipefail
          python scripts/16_download_productivity_p2.py

      - name: score productivity p2
        run: |
          set -euo pipefail
          python scripts/19_score_productivity_p2.py

      # ==============================================================
      # PRODUCTIVITY PILLAR
      # ==============================================================

      - name: construct productivity pillar
        run: |
          set -euo pipefail
          python scripts/20_construct_productivity_pillar.py

      # ==============================================================
      # CONNECTIVITY
      # ==============================================================

      - name: download connectivity data
        run: |
          set -euo pipefail
          python scripts/21_download_connectivity_data.py

      - name: download connectivity source data
        run: |
          set -euo pipefail
          python scripts/22_download_connectivity_data.py

      - name: analyze connectivity distribution
        run: |
          set -euo pipefail
          python scripts/23_analyze_connectivity_distribution.py

      - name: score connectivity indicators
        run: |
          set -euo pipefail
          python scripts/24_score_connectivity.py

      - name: construct connectivity pillar
        run: |
          set -euo pipefail
          python scripts/25_construct_connectivity_pillar.py

      # ==============================================================
      # RESILIENCE
      # ==============================================================

      - name: download resilience data
        run: |
          set -euo pipefail
          python scripts/08_download_resilience_data.py

      - name: validate resilience data
        run: |
          set -euo pipefail
          python scripts/09_validate_resilience_data.py

      - name: analyze resilience distribution
        run: |
          set -euo pipefail
          python scripts/10_analyze_resilience_distribution.py

      - name: score resilience pillar
        run: |
          set -euo pipefail
          python scripts/11_score_resilience_pillar.py

      # ==============================================================
      # STRATEGIC AUTONOMY
      # ==============================================================

      - name: download strategic autonomy data
        run: |
          set -euo pipefail
          python scripts/29_download_autonomy_data.py

      - name: download import concentration data
        run: |
          set -euo pipefail
          python scripts/31_download_import_concentration.py

      - name: validate strategic autonomy data
        run: |
          set -euo pipefail
          python scripts/30_validate_autonomy_data.py

      - name: validate autonomy data integration
        run: |
          set -euo pipefail
          python scripts/32_validate_autonomy_data.py

      - name: analyze autonomy distribution
        run: |
          set -euo pipefail
          python scripts/33_analyze_autonomy_distribution.py

      - name: score strategic autonomy indicators
        run: |
          set -euo pipefail
          python scripts/34_score_autonomy.py

      - name: construct strategic autonomy pillar
        run: |
          set -euo pipefail
          python scripts/35_construct_autonomy_pillar.py

      # ==============================================================
      # VERIFY ALL PILLAR OUTPUTS
      # ==============================================================

      - name: verify growth pillar output
        run: |
          set -euo pipefail
          test -f data/processed/growth_pillar_scores_2015_2024.csv

      - name: verify productivity pillar output
        run: |
          set -euo pipefail
          test -f data/processed/productivity_pillar_scores_2016_2023.csv

      - name: verify connectivity pillar output
        run: |
          set -euo pipefail
          test -f data/processed/connectivity_pillar_scores_2015_2024.csv

      - name: verify resilience pillar output
        run: |
          set -euo pipefail
          test -f data/processed/resilience_pillar_scores_2015_2024.csv

      - name: verify strategic autonomy pillar output
        run: |
          set -euo pipefail
          test -f data/processed/strategic_autonomy_pillar_2015_2024.csv

      - name: verify all pillar outputs
        run: |
          set -euo pipefail
          echo "ALL FIVE JESI PILLAR OUTPUTS ARE PRESENT"

      # ==============================================================
      # FINAL JESI CALCULATION
      # ==============================================================

      - name: calculate jesi
        run: |
          set -euo pipefail
          python scripts/36_calculate_jesi.py

      # ==============================================================
      # ROBUSTNESS TESTS
      # ==============================================================

      - name: run jesi robustness tests
        run: |
          set -euo pipefail
          python scripts/37_robustness_tests.py

      # ==============================================================
      # FINAL RESULTS
      # ==============================================================

      - name: generate final jesi results
        run: |
          set -euo pipefail
          python scripts/38_generate_final_jesi_results.py

      # ==============================================================
      # FINAL VALIDATION
      # ==============================================================

      - name: validate final jesi results
        run: |
          set -euo pipefail
          python scripts/39_validate_final_jesi.py

      # ==============================================================
      # BALANCED-PANEL SENSITIVITY ANALYSIS
      # ==============================================================

      - name: run balanced-panel sensitivity analysis
        run: |
          set -euo pipefail
          python scripts/50_balanced_panel_sensitivity.py

      - name: verify balanced-panel outputs
        run: |
          set -euo pipefail
          test -f data/results/jesi_balanced_panel_country_results.csv
          test -f data/results/jesi_balanced_panel_country_means.csv
          test -f data/results/jesi_balanced_panel_summary.csv
          echo "BALANCED-PANEL OUTPUT VERIFICATION: PASSED"

      # ==============================================================
      # RESEARCH REPORT
      # ==============================================================

      - name: generate jesi research report
        run: |
          set -euo pipefail
          python scripts/40_generate_jesi_report.py

      # ==============================================================
      # README
      # ==============================================================

      - name: update readme
        run: |
          set -euo pipefail
          python scripts/41_update_readme_jesi.py

      # ==============================================================
      # FINAL REPOSITORY AUDIT
      # ==============================================================

      - name: run final repository audit
        run: |
          set -euo pipefail
          python scripts/42_final_repository_audit.py

      # ==============================================================
      # FINAL OUTPUT VERIFICATION
      # ==============================================================

      - name: verify final jesi outputs
        run: |
          set -euo pipefail
          test -d data/results
          test -f docs/JESI_Final_Results_Report.md
          test -f README.md
          echo "FINAL JESI OUTPUT VERIFICATION: PASSED"

      # ==============================================================
      # UPLOAD FINAL ARTIFACT
      # ==============================================================

      - name: upload final jesi outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JESI-final-results
          if-no-files-found: error
          path: |
            data/processed/
            data/results/
            docs/JESI_Final_Results_Report.md
            README.md

      # ==============================================================
      # SUCCESS SUMMARY
      # ==============================================================

      - name: final pipeline success
        run: |
          set -euo pipefail
          echo "JAS-JESI FINAL PIPELINE COMPUTATION COMPLETED"
          echo "Growth: COMPLETE"
          echo "Productivity P1/P2: COMPLETE"
          echo "Connectivity: COMPLETE"
          echo "Resilience: COMPLETE"
          echo "Strategic Autonomy: COMPLETE"
          echo "JESI Calculation: COMPLETE"
          echo "Robustness Tests: COMPLETE"
          echo "Balanced-Panel Sensitivity: COMPLETE"
          echo "Final Validation: COMPLETE"
          echo "Research Report: COMPLETE"
          echo "Repository Audit: COMPLETE"


  # ==============================================================
  # COMMIT GENERATED OUTPUTS THROUGH A PULL REQUEST
  # ==============================================================

  commit-results:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )

    needs: final-jesi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: download generated jesi outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: JESI-final-results
          path: .

      - name: verify generated outputs
        run: |
          set -euo pipefail
          test -d data/processed
          test -d data/results
          test -f docs/JESI_Final_Results_Report.md
          test -f README.md
          echo "Generated JESI outputs verified."

      - name: verify source commit is still current
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch origin main

          REMOTE_SHA="$(git rev-parse origin/main)"

          echo "Workflow source SHA: ${SOURCE_SHA}"
          echo "Current remote main: ${REMOTE_SHA}"

          if [ "${REMOTE_SHA}" != "${SOURCE_SHA}" ]; then
            echo "ERROR: Remote main changed while JESI pipeline was running."
            echo "Generated outputs will NOT be submitted."
            exit 1
          fi

          echo "Remote main is unchanged."

      - name: create pull request via git cli
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com>"

          BRANCH_NAME="data-update/jesi-results-auto"
          git checkout -b "$BRANCH_NAME"

          git add data/processed/ data/results/ docs/JESI_Final_Results_Report.md README.md

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update final JESI results with balanced-panel analysis"

          git push origin "$BRANCH_NAME" --force

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Automated JESI Results & Balanced-Panel Update" \
            --body "This automated pull request contains generated JAS-JESI results, balanced-panel sensitivity outputs, and the updated research report. Source workflow run: #${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: final pipeline success
        run: |
          set -euo pipefail
          echo "JAS-JESI RESULTS AUTOMATION STEP COMPLETED"
          echo "Review the Pull Request before merging into main."
