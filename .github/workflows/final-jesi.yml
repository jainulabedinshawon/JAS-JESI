name: Final JESI Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/08_download_resilience_data.py"
      - "scripts/09_validate_resilience_data.py"
      - "scripts/10_analyze_resilience_distribution.py"
      - "scripts/11_score_resilience_pillar.py"
      - "scripts/12_download_productivity_data.py"
      - "scripts/15_score_productivity_p1.py"
      - "scripts/16_download_productivity_p2.py"
      - "scripts/19_score_productivity_p2.py"
      - "scripts/20_construct_productivity_pillar.py"
      - "scripts/21_download_connectivity_data.py"
      - "scripts/22_download_connectivity_data.py"
      - "scripts/23_analyze_connectivity_distribution.py"
      - "scripts/24_score_connectivity.py"
      - "scripts/25_construct_connectivity_pillar.py"
      - "scripts/27_score_growth.py"
      - "scripts/28_construct_growth_pillar.py"
      - "scripts/29_download_autonomy_data.py"
      - "scripts/30_validate_autonomy_data.py"
      - "scripts/31_download_import_concentration.py"
      - "scripts/32_validate_autonomy_data.py"
      - "scripts/33_analyze_autonomy_distribution.py"
      - "scripts/34_score_autonomy.py"
      - "scripts/35_construct_autonomy_pillar.py"
      - "scripts/36_calculate_jesi.py"
      - "scripts/37_robustness_tests.py"
      - "scripts/38_generate_final_jesi_results.py"
      - "scripts/39_validate_final_jesi.py"
      - "scripts/40_generate_jesi_report.py"
      - "scripts/41_update_readme_jesi.py"
      - "scripts/42_final_repository_audit.py"
      - "src/**"
      - "data/raw/**"
      - "data/processed/**"
      - ".github/workflows/final-jesi.yml"

permissions:
  contents: write

jobs:
  final-jesi:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------------
      # Checkout
      # --------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # Python
      # --------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # --------------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pandas numpy scipy openpyxl

      # --------------------------------------------------------------
      # Python package path
      # --------------------------------------------------------------

      - name: Configure Python path
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Verify Python package
        run: |
          python -c "import src; print('src package import: OK')"

      # ==============================================================
      # GROWTH
      # ==============================================================

      - name: Build Growth pillar
        run: |
          python scripts/27_score_growth.py
          python scripts/28_construct_growth_pillar.py

      # ==============================================================
      # PRODUCTIVITY P1
      # ==============================================================

      - name: Download Productivity P1 data
        run: |
          python scripts/12_download_productivity_data.py

      - name: Score Productivity P1
        run: |
          python scripts/15_score_productivity_p1.py

      # ==============================================================
      # PRODUCTIVITY P2
      # ==============================================================

      - name: Download Productivity P2 data
        run: |
          python scripts/16_download_productivity_p2.py

      - name: Score Productivity P2
        run: |
          python scripts/19_score_productivity_p2.py

      # ==============================================================
      # PRODUCTIVITY PILLAR
      # ==============================================================

      - name: Construct Productivity pillar
        run: |
          python scripts/20_construct_productivity_pillar.py

      # ==============================================================
      # CONNECTIVITY
      # ==============================================================

      - name: Download Connectivity data
        run: |
          python scripts/21_download_connectivity_data.py

      - name: Download Connectivity data sources
        run: |
          python scripts/22_download_connectivity_data.py

      - name: Analyze Connectivity distribution
        run: |
          python scripts/23_analyze_connectivity_distribution.py

      - name: Score Connectivity indicators
        run: |
          python scripts/24_score_connectivity.py

      - name: Construct Connectivity pillar
        run: |
          python scripts/25_construct_connectivity_pillar.py

      # ==============================================================
      # RESILIENCE
      # ==============================================================

      - name: Download Resilience data
        run: |
          python scripts/08_download_resilience_data.py

      - name: Validate Resilience data
        run: |
          python scripts/09_validate_resilience_data.py

      - name: Analyze Resilience distribution
        run: |
          python scripts/10_analyze_resilience_distribution.py

      - name: Score Resilience pillar
        run: |
          python scripts/11_score_resilience_pillar.py

      # ==============================================================
      # STRATEGIC AUTONOMY
      # ==============================================================

      - name: Download Strategic Autonomy data
        run: |
          python scripts/29_download_autonomy_data.py

      # --------------------------------------------------------------
      # Import concentration MUST be downloaded before validation
      # --------------------------------------------------------------

      - name: Download Import Concentration data
        run: |
          python scripts/31_download_import_concentration.py

      - name: Validate Strategic Autonomy data
        run: |
          python scripts/30_validate_autonomy_data.py

      - name: Validate Autonomy data integration
        run: |
          python scripts/32_validate_autonomy_data.py

      - name: Analyze Autonomy distribution
        run: |
          python scripts/33_analyze_autonomy_distribution.py

      - name: Score Strategic Autonomy indicators
        run: |
          python scripts/34_score_autonomy.py

      - name: Construct Strategic Autonomy pillar
        run: |
          python scripts/35_construct_autonomy_pillar.py

      # ==============================================================
      # VERIFY PILLAR OUTPUTS
      # ==============================================================

      - name: Verify pillar outputs
        run: |
          test -f data/processed/growth_pillar_scores_2015_2024.csv
          test -f data/processed/productivity_pillar_scores_2016_2023.csv
          test -f data/processed/connectivity_pillar_scores_2015_2024.csv
          test -f data/processed/resilience_pillar_scores_2015_2024.csv
          test -f data/processed/strategic_autonomy_pillar_2015_2024.csv

          echo "All required pillar outputs exist."

      # ==============================================================
      # FINAL JESI CALCULATION
      # ==============================================================

      - name: Calculate JESI
        run: |
          python scripts/36_calculate_jesi.py

      # ==============================================================
      # ROBUSTNESS
      # ==============================================================

      - name: Run JESI robustness tests
        run: |
          python scripts/37_robustness_tests.py

      # ==============================================================
      # FINAL RESULTS
      # ==============================================================

      - name: Generate final JESI results
        run: |
          python scripts/38_generate_final_jesi_results.py

      # ==============================================================
      # VALIDATION
      # ==============================================================

      - name: Validate final JESI results
        run: |
          python scripts/39_validate_final_jesi.py

      # ==============================================================
      # REPORT
      # ==============================================================

      - name: Generate JESI research report
        run: |
          python scripts/40_generate_jesi_report.py

      # ==============================================================
      # README
      # ==============================================================

      - name: Update README
        run: |
          python scripts/41_update_readme_jesi.py

      # ==============================================================
      # FINAL REPOSITORY AUDIT
      # ==============================================================

      - name: Run final repository audit
        run: |
          python scripts/42_final_repository_audit.py

      # ==============================================================
      # ARTIFACT
      # ==============================================================

      - name: Upload final JESI outputs
        uses: actions/upload-artifact@v4
        with:
          name: JESI-final-results
          path: |
            data/results/
            docs/JESI_Final_Results_Report.md
            README.md

      # ==============================================================
      # COMMIT GENERATED OUTPUTS
      # ==============================================================

      - name: Commit generated JESI outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed data/results docs/JESI_Final_Results_Report.md README.md

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update final JESI results"
            git push
          fi
