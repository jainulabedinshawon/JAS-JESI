name: Final JESI Pipeline

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/**"
      - "src/**"
      - ".github/workflows/final-jesi.yml"
      - "requirements.txt"

# ==============================================================
# GLOBAL SECURITY
# ==============================================================
# No repository write permission is granted globally.
# The computational job receives read-only access.
# The separate commit job receives write access only when required.

permissions:
  contents: read

concurrency:
  group: final-jesi-pipeline
  cancel-in-progress: false

jobs:

  # ==============================================================
  # MAIN JESI COMPUTATION + VALIDATION
  # ==============================================================

  final-jesi:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: "pip"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found."
            exit 1
          fi

          python -m pip install -r requirements.txt

      # ============================================================
      # PYTHON PATH
      # ============================================================

      - name: Configure Python path
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Verify Python environment
        run: |
          python --version
          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import numpy; print('numpy:', numpy.__version__)"
          python -c "import scipy; print('scipy:', scipy.__version__)"
          python -c "import openpyxl; print('openpyxl:', openpyxl.__version__)"
          python -c "import src; print('src package import: OK')"

      # ============================================================
      # PYTHON SYNTAX VALIDATION
      # ============================================================

      - name: Validate Python syntax
        run: |
          python -m compileall -q scripts src
          echo "Python syntax validation: PASSED"

      # ============================================================
      # TEST SUITE
      # ============================================================

      - name: Run JESI test suite
        run: |
          PYTHONPATH=. pytest

      # ============================================================
      # GROWTH
      # ============================================================

      - name: Score Growth indicators
        run: |
          python scripts/27_score_growth.py

      - name: Construct Growth pillar
        run: |
          python scripts/28_construct_growth_pillar.py

      # ============================================================
      # PRODUCTIVITY P1
      # ============================================================

      - name: Download Productivity P1 data
        run: |
          python scripts/12_download_productivity_data.py

      - name: Score Productivity P1
        run: |
          python scripts/15_score_productivity_p1.py

      # ============================================================
      # PRODUCTIVITY P2
      # ============================================================

      - name: Download Productivity P2 data
        run: |
          python scripts/16_download_productivity_p2.py

      - name: Score Productivity P2
        run: |
          python scripts/19_score_productivity_p2.py

      # ============================================================
      # PRODUCTIVITY PILLAR
      # ============================================================

      - name: Construct Productivity pillar
        run: |
          python scripts/20_construct_productivity_pillar.py

      # ============================================================
      # CONNECTIVITY
      # ==============================================================

      - name: Download Connectivity data
        run: |
          python scripts/21_download_connectivity_data.py

      - name: Download Connectivity source data
        run: |
          python scripts/22_download_connectivity_data.py

      - name: Analyze Connectivity distribution
        run: |
          python scripts/23_analyze_connectivity_distribution.py

      - name: Score Connectivity indicators
        run: |
          python scripts/24_score_connectivity.py

      - name: Construct Connectivity pillar
        run: |
          python scripts/25_construct_connectivity_pillar.py

      # ==============================================================
      # RESILIENCE
      # ==============================================================

      - name: Download Resilience data
        run: |
          python scripts/08_download_resilience_data.py

      - name: Validate Resilience data
        run: |
          python scripts/09_validate_resilience_data.py

      - name: Analyze Resilience distribution
        run: |
          python scripts/10_analyze_resilience_distribution.py

      - name: Score Resilience pillar
        run: |
          python scripts/11_score_resilience_pillar.py

      # ==============================================================
      # STRATEGIC AUTONOMY
      # ==============================================================

      - name: Download Strategic Autonomy data
        run: |
          python scripts/29_download_autonomy_data.py

      - name: Download Import Concentration data
        run: |
          python scripts/31_download_import_concentration.py

      - name: Validate Strategic Autonomy data
        run: |
          python scripts/30_validate_autonomy_data.py

      - name: Validate Autonomy data integration
        run: |
          python scripts/32_validate_autonomy_data.py

      - name: Analyze Autonomy distribution
        run: |
          python scripts/33_analyze_autonomy_distribution.py

      - name: Score Strategic Autonomy indicators
        run: |
          python scripts/34_score_autonomy.py

      - name: Construct Strategic Autonomy pillar
        run: |
          python scripts/35_construct_autonomy_pillar.py

      # ==============================================================
      # VERIFY ALL PILLAR OUTPUTS
      # ==============================================================

      - name: Verify Growth pillar output
        run: |
          test -f data/processed/growth_pillar_scores_2015_2024.csv
          echo "Growth pillar output: OK"

      - name: Verify Productivity pillar output
        run: |
          test -f data/processed/productivity_pillar_scores_2016_2023.csv
          echo "Productivity pillar output: OK"

      - name: Verify Connectivity pillar output
        run: |
          test -f data/processed/connectivity_pillar_scores_2015_2024.csv
          echo "Connectivity pillar output: OK"

      - name: Verify Resilience pillar output
        run: |
          test -f data/processed/resilience_pillar_scores_2015_2024.csv
          echo "Resilience pillar output: OK"

      - name: Verify Strategic Autonomy pillar output
        run: |
          test -f data/processed/strategic_autonomy_pillar_2015_2024.csv
          echo "Strategic Autonomy pillar output: OK"

      - name: Verify all pillar outputs
        run: |
          echo "=============================================="
          echo "ALL FIVE JESI PILLAR OUTPUTS ARE PRESENT"
          echo "=============================================="

      # ==============================================================
      # FINAL JESI CALCULATION
      # ==============================================================

      - name: Calculate JESI
        run: |
          python scripts/36_calculate_jesi.py

      # ==============================================================
      # ROBUSTNESS TESTS
      # ==============================================================

      - name: Run JESI robustness tests
        run: |
          python scripts/37_robustness_tests.py

      # ==============================================================
      # FINAL RESULTS
      # ==============================================================

      - name: Generate final JESI results
        run: |
          python scripts/38_generate_final_jesi_results.py

      # ==============================================================
      # FINAL VALIDATION
      # ==============================================================

      - name: Validate final JESI results
        run: |
          python scripts/39_validate_final_jesi.py

      # ==============================================================
      # RESEARCH REPORT
      # ==============================================================

      - name: Generate JESI research report
        run: |
          python scripts/40_generate_jesi_report.py

      # ==============================================================
      # README
      # ==============================================================

      - name: Update README
        run: |
          python scripts/41_update_readme_jesi.py

      # ==============================================================
      # FINAL REPOSITORY AUDIT
      # ==============================================================

      - name: Run final repository audit
        run: |
          python scripts/42_final_repository_audit.py

      # ==============================================================
      # FINAL OUTPUT VERIFICATION
      # ==============================================================

      - name: Verify final JESI outputs
        run: |
          test -d data/results
          test -f docs/JESI_Final_Results_Report.md
          test -f README.md

          echo "=============================================="
          echo "FINAL JESI OUTPUT VERIFICATION: PASSED"
          echo "=============================================="

      # ==============================================================
      # UPLOAD FINAL ARTIFACT
      # ==============================================================

      - name: Upload final JESI outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JESI-final-results
          if-no-files-found: error
          path: |
            data/processed/
            data/results/
            docs/JESI_Final_Results_Report.md
            README.md

      # ==============================================================
      # SUCCESS SUMMARY
      # ==============================================================

      - name: Final pipeline success
        run: |
          echo "=================================================="
          echo "JAS-JESI FINAL PIPELINE COMPUTATION COMPLETED"
          echo "=================================================="
          echo "Growth:              COMPLETE"
          echo "Productivity P1/P2:  COMPLETE"
          echo "Connectivity:        COMPLETE"
          echo "Resilience:          COMPLETE"
          echo "Strategic Autonomy: COMPLETE"
          echo "JESI Calculation:    COMPLETE"
          echo "Robustness Tests:    COMPLETE"
          echo "Final Validation:    COMPLETE"
          echo "Research Report:     COMPLETE"
          echo "Repository Audit:    COMPLETE"
          echo "=================================================="


  # ==============================================================
  # COMMIT GENERATED OUTPUTS
  # ==============================================================
  #
  # This job is intentionally separated from the computational job.
  # It is the ONLY job that receives contents: write permission.
  #
  # ==============================================================

  commit-results:
    needs: final-jesi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # DOWNLOAD GENERATED ARTIFACT
      # ============================================================

      - name: Download generated JESI outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: JESI-final-results
          path: .

      # ============================================================
      # VERIFY DOWNLOADED OUTPUTS
      # ============================================================

      - name: Verify generated outputs
        run: |
          test -d data/results
          test -f docs/JESI_Final_Results_Report.md
          test -f README.md

          echo "Generated JESI outputs downloaded successfully."

      # ============================================================
      # COMMIT GENERATED OUTPUTS
      # ==============================================================

      - name: Commit generated JESI outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed
          git add data/results
          git add docs/JESI_Final_Results_Report.md
          git add README.md

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update final JESI results"
            git push
          fi

      # ============================================================
      # SUCCESS SUMMARY
      # ============================================================

      - name: Final pipeline success
        run: |
          echo "=================================================="
          echo "JAS-JESI FINAL PIPELINE COMPLETED SUCCESSFULLY"
          echo "=================================================="
          echo "Generated outputs committed successfully."
          echo "=================================================="
