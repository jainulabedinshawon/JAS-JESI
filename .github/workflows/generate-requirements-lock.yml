name: Generate and Validate JESI Requirements Lock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jesi-requirements-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-validate:
    name: Generate and validate Python 3.10 lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lock generator tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pip-tools==7.4.1"

      - name: Generate updated requirements.lock
        run: |
          set -euo pipefail
          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --no-emit-index-url \
            --allow-unsafe \
            --output-file=requirements.lock \
            requirements.txt

      - name: Commit updated lock file directly
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          if git diff --cached --quiet; then
            echo "requirements.lock is already up to date."
            exit 0
          fi
          git commit -m "chore: auto-generate updated requirements lock"
          git push
