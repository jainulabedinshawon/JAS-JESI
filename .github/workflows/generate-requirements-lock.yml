name: Generate and Validate JESI Requirements Lock

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jesi-requirements-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-validate:
    name: Generate and validate Python 3.10 lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@0b93645e9fea7318edeed242847239ef87b00344
        with:
          python-version: "3.10"

      - name: Install pinned lock generator
        run: |
          set -euo pipefail
          python -m pip install "pip==24.0" "pip-tools==7.4.1"

      - name: Validate source requirements
        run: |
          set -euo pipefail
          test -s requirements.txt

      - name: Generate hashed lock file
        run: |
          set -euo pipefail
          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --no-emit-index-url \
            --allow-unsafe \
            --output-file=requirements.lock \
            requirements.txt

          test -s requirements.lock

      - name: Create clean validation environment
        run: |
          set -euo pipefail
          python -m venv .lock-test-venv
          .lock-test-venv/bin/python -m pip install "pip==24.0"

      - name: Install locked dependencies with mandatory hashes
        run: |
          set -euo pipefail
          .lock-test-venv/bin/python -m pip install \
            --require-hashes \
            -r requirements.lock

      - name: Check dependency consistency
        run: |
          set -euo pipefail
          .lock-test-venv/bin/python -m pip check

      - name: Run repository tests
        run: |
          set -euo pipefail
          .lock-test-venv/bin/python -m pytest -ra

      - name: Create isolated security audit environment
        run: |
          set -euo pipefail
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install "pip==24.0" "pip-audit==2.10.1"

      - name: Audit locked dependencies
        run: |
          set -euo pipefail
          .audit-venv/bin/pip-audit -r requirements.lock

      - name: Upload validated lock file
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: jesi-validated-requirements-lock
          path: requirements.lock
          if-no-files-found: error
          retention-days: 7
