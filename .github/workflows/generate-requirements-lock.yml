name: Generate and Validate JESI Requirements Lock

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jesi-requirements-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-validate:
    name: Generate Python 3.10 lock and validate it
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Generate hashed lock file
        run: |
          set -euo pipefail

          python -m pip install --upgrade "pip<26"
          python -m pip install "pip-tools==7.4.1"

          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --no-emit-index-url \
            --allow-unsafe \
            --output-file=requirements.lock \
            requirements.txt

          test -s requirements.lock

          # Reject the SHA-256 digest of an empty file.
          if grep -q \
            'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855' \
            requirements.lock; then
            echo "ERROR: Empty-file SHA-256 found in generated lock."
            exit 1
          fi

          echo "Generated lock preview:"
          sed -n '1,100p' requirements.lock

      - name: Install locked dependencies in a clean environment
        run: |
          set -euo pipefail

          python -m venv .venv-lock-test
          . .venv-lock-test/bin/activate

          python -m pip install --upgrade "pip<26"
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check

          PYTHONPATH=. python -m pytest -ra

      - name: Audit locked dependencies
        run: |
          set -euo pipefail

          python -m venv .venv-audit
          . .venv-audit/bin/activate

          python -m pip install --upgrade "pip<26"
          python -m pip install "pip-audit==2.10.1"

          mkdir -p audit/requirements-lock

          pip-audit \
            -r requirements.lock \
            --format json \
            --output audit/requirements-lock/pip-audit.json

      - name: Record lock evidence
        if: always()
        run: |
          mkdir -p audit/requirements-lock

          cp requirements.lock audit/requirements-lock/ \
            2>/dev/null || true

          {
            echo "Python baseline: 3.10"
            python --version
            echo
            echo "Source requirements:"
            cat requirements.txt
            echo
            echo "Generated lock SHA-256:"
            if [ -f requirements.lock ]; then
              sha256sum requirements.lock
            else
              echo "requirements.lock was not generated."
            fi
          } > audit/requirements-lock/lock-evidence.txt

      - name: Upload lock and evidence for human review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jesi-requirements-lock-review
          if-no-files-found: warn
          path: |
            requirements.lock
            audit/requirements-lock/
