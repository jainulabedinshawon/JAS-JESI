name: Generate and Validate JESI Requirements Lock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jesi-requirements-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-validate:
    name: Generate Python 3.10 lock and validate it
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate hashed lock file
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install --upgrade pip-tools

          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --no-emit-index-url \
            --allow-unsafe \
            --output-file=requirements.lock \
            requirements.txt

          test -s requirements.lock

      - name: Automatically commit and push updated lock file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update requirements.lock with verified hashes [skip ci]" && git push)
