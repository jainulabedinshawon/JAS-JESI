name: Validate JESI Resilience Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resilience-pillar:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Resilience data
        run: |
          PYTHONPATH=. python scripts/08_download_resilience_data.py

      - name: Validate Resilience data
        run: |
          PYTHONPATH=. python scripts/09_validate_resilience_data.py
