name: JESI Final Methodological Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jesi-final-methodological-audit
  cancel-in-progress: false

jobs:
  methodological-audit:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy

      - name: Validate audit script syntax
        run: |
          python -m py_compile \
            scripts/49_final_methodological_audit.py

          echo "Methodological audit syntax: PASSED"

      - name: Run final methodological audit
        run: |
          python scripts/49_final_methodological_audit.py

      - name: Verify audit is read-only
        run: |
          git status --short
          git diff --exit-code

          echo "Repository remained unchanged."

      - name: Capture audit evidence
        if: always()
        run: |
          python scripts/49_final_methodological_audit.py \
            > final_methodological_audit.log 2>&1 || true

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JESI-final-methodological-audit
          retention-days: 90
          path: final_methodological_audit.log
