name: JESI Final Methodological Audit

on:
- workflow_dispatch

permissions:
  contents: read

concurrency:
  group: jesi-final-methodological-audit
  cancel-in-progress: false

jobs:
  methodological-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate audit syntax
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/49_final_methodological_audit.py

      - name: Run final methodological audit
        run: |
          set -euo pipefail
          python scripts/49_final_methodological_audit.py

      - name: Verify audit is read-only
        run: |
          set -euo pipefail
          git status --short
          git diff --exit-code

          echo "Repository remained unchanged."

      - name: Capture audit evidence
        if: always()
        run: |
          python scripts/49_final_methodological_audit.py \
            > final_methodological_audit.log 2>&1 || true

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: JESI-final-methodological-audit
          if-no-files-found: error
          retention-days: 90
          path: final_methodological_audit.log
