name: JAS-JESI Step E + Step F Audit

on:
  workflow_dispatch:

# Read-only audit: this workflow must never write to the repository.
permissions:
  contents: read

concurrency:
  group: jesi-pytest-step-e-f-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # STEP E0: record the exact checked-in reference state.
  reference:
    name: E0 Reference Environment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Record reference identity and input hashes
        run: |
          set -euo pipefail
          mkdir -p audit/reference

          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Ref: ${GITHUB_REF}"
            echo
            uname -a
            lscpu | grep -E 'Architecture|Model name|CPU\(s\)' || true
            echo
            python --version
            python -c "import sys, platform; print(sys.version); print(platform.platform()); print(platform.machine())"
            echo
            git rev-parse HEAD
          } > audit/reference/environment.txt

          {
            echo "Input SHA-256 manifest"
            echo "======================"
            find data/raw data/processed -type f -print0 2>/dev/null \
              | sort -z \
              | xargs -0 -r sha256sum
          } > audit/reference/input-sha256.txt

          test -d data/results
          mkdir -p audit/reference/checked-in-results
          cp -a data/results/. audit/reference/checked-in-results/

          find audit/reference/checked-in-results -type f -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            > audit/reference/checked-in-results-sha256.txt

      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jesi-step-e-reference
          if-no-files-found: error
          path: audit/reference/

  # STEP E1: test the same test suite against selected pytest versions.
  compatibility:
    name: E1 Pytest ${{ matrix.pytest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pytest: ["9.0.3", "9.1.1"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Create isolated candidate environment
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip

          # pytest is the only variable in this compatibility matrix.
          grep -v '^pytest==' requirements.txt > /tmp/requirements-no-pytest.txt
          python -m pip install -r /tmp/requirements-no-pytest.txt
          python -m pip install "pytest==${{ matrix.pytest }}"

          python --version
          pytest --version
          python -c "import pytest; assert pytest.__version__ == '${{ matrix.pytest }}'"

      - name: Record installed environment
        run: |
          set -euo pipefail
          . .venv/bin/activate
          mkdir -p audit/compatibility
          python -m pip freeze | sort \
            > "audit/compatibility/pip-freeze-${{ matrix.pytest }}.txt"

      - name: Run primary test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -c "import src; print('src import: OK')"
          pytest -ra

      - name: Run deprecation diagnostic
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          . .venv/bin/activate
          pytest -ra -W error::DeprecationWarning \
            > "audit-deprecation-${{ matrix.pytest }}.log" 2>&1

      - name: Create separate pip-audit environment
        if: always()
        run: |
          set -euo pipefail
          python -m venv .audit-venv
          . .audit-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "pip-audit==2.10.1"

      - name: Build candidate dependency specification
        if: always()
        run: |
          set -euo pipefail
          grep -v '^pytest==' requirements.txt > /tmp/requirements-candidate.txt
          echo "pytest==${{ matrix.pytest }}" >> /tmp/requirements-candidate.txt
          cat /tmp/requirements-candidate.txt

      - name: Audit candidate requirements
        if: always()
        run: |
          set -euo pipefail
          mkdir -p audit/security
          . .audit-venv/bin/activate
          set +e
          pip-audit -r /tmp/requirements-candidate.txt \
            --format json \
            --output "audit/security/requirements-pip-audit-${{ matrix.pytest }}.json"
          status=$?
          set -e
          echo "requirements pip-audit exit code: ${status}"
          test -f "audit/security/requirements-pip-audit-${{ matrix.pytest }}.json"
          if [ "${status}" -ne 0 ]; then
            echo "pip-audit found vulnerabilities or could not complete."
            exit "${status}"
          fi

      - name: Audit installed candidate environment
        if: always()
        run: |
          set -euo pipefail
          mkdir -p audit/security
          . .audit-venv/bin/activate
          site_packages="$(. .venv/bin/activate 2>/dev/null; python -c 'import site; print(site.getsitepackages()[0])')"
          set +e
          pip-audit --path "${site_packages}" \
            --format json \
            --output "audit/security/installed-pip-audit-${{ matrix.pytest }}.json"
          status=$?
          set -e
          echo "installed environment pip-audit exit code: ${status}"
          test -f "audit/security/installed-pip-audit-${{ matrix.pytest }}.json"
          if [ "${status}" -ne 0 ]; then
            echo "Installed environment audit found vulnerabilities or could not complete."
            exit "${status}"
          fi

      - name: Upload Step E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jesi-step-e-${{ matrix.pytest }}
          if-no-files-found: error
          path: |
            audit/
            audit-deprecation-${{ matrix.pytest }}.log

  # STEP F1: freeze the Master 1.0 reference pytest version, run A/B,
  # and compare the fresh result with the checked-in result.
  baseline-determinism:
    name: F1 Baseline 9.0.3 Determinism
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [reference, compatibility]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Create baseline environment
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip

          # Keep the Python 3.10 research environment unchanged.
          # Use the security-reviewed pytest baseline.
          grep -v '^pytest==' requirements.txt > /tmp/requirements-baseline.txt
          python -m pip install -r /tmp/requirements-baseline.txt
          python -m pip install "pytest==9.0.3"

          python --version
          pytest --version
          python -c "import pytest; assert pytest.__version__ == '9.0.3', pytest.__version__; print('Baseline pytest 9.0.3 verified')"

      - name: Download and freeze external inputs once
        run: |
          set -euo pipefail
          # Activate the Python 3.10 baseline environment
          . .venv/bin/activate
          
          mkdir -p audit/master

          # Download each external input only once for this audit run.
          python scripts/12_download_productivity_data.py
          python scripts/16_download_productivity_p2.py
          python scripts/21_download_connectivity_data.py
          python scripts/08_download_resilience_data.py
          python scripts/29_download_autonomy_data.py
          python scripts/31_download_import_concentration.py

          # This workbook is an additional input used by the pipeline.
          test -f WEOApr2026all.xlsx

          python scripts/44_input_manifest.py create \
            --output audit/master/input-manifest.json \
            --extra-file WEOApr2026all.xlsx

          # Freeze the complete raw-data directory and the additional workbook.
          tar -czf audit/master/frozen-inputs.tar.gz \
            data/raw WEOApr2026all.xlsx

          # Store the checksum relative to the archive directory.
          (
            cd audit/master
            sha256sum frozen-inputs.tar.gz \
              > frozen-inputs-archive.sha256
          )

          # Confirm the snapshot matches the manifest before proceeding.
          python scripts/44_input_manifest.py verify \
            --manifest audit/master/input-manifest.json \
            --extra-file WEOApr2026all.xlsx

      - name: Preserve checked-in Master 1.0 results
        run: |
          set -euo pipefail
          test -d data/results
          mkdir -p audit/master/checked-in-results
          cp -a data/results/. audit/master/checked-in-results/

      - name: Restore frozen inputs before baseline A
        run: |
          set -euo pipefail
          rm -rf data/raw
          tar -xzf audit/master/frozen-inputs.tar.gz -C .

          python scripts/44_input_manifest.py verify \
            --manifest audit/master/input-manifest.json \
            --extra-file WEOApr2026all.xlsx

      - name: Clean generated results before baseline A
        run: |
          set -euo pipefail
          rm -rf data/results
          mkdir -p data/results

      - name: Run full Master 1.0 pipeline A
        run: |
          set -euo pipefail
          . .venv/bin/activate
          export PYTHONPATH="${GITHUB_WORKSPACE}"

          python scripts/27_score_growth.py
          python scripts/28_construct_growth_pillar.py
          python scripts/15_score_productivity_p1.py
          python scripts/19_score_productivity_p2.py
          python scripts/20_construct_productivity_pillar.py
          python scripts/22_download_connectivity_data.py
          python scripts/23_analyze_connectivity_distribution.py
          python scripts/24_score_connectivity.py
          python scripts/25_construct_connectivity_pillar.py
          python scripts/09_validate_resilience_data.py
          python scripts/10_analyze_resilience_distribution.py
          python scripts/11_score_resilience_pillar.py
          python scripts/30_validate_autonomy_data.py
          python scripts/32_validate_autonomy_data.py
          python scripts/33_analyze_autonomy_distribution.py
          python scripts/34_score_autonomy.py
          python scripts/35_construct_autonomy_pillar.py

          test -f data/processed/growth_pillar_scores_2015_2024.csv
          test -f data/processed/productivity_pillar_scores_2016_2023.csv
          test -f data/processed/connectivity_pillar_scores_2015_2024.csv
          test -f data/processed/resilience_pillar_scores_2015_2024.csv
          test -f data/processed/strategic_autonomy_pillar_2015_2024.csv

          python scripts/36_calculate_jesi.py
          python scripts/37_robustness_tests.py
          python scripts/38_generate_final_jesi_results.py
          python scripts/39_validate_final_jesi.py
          python scripts/40_generate_jesi_report.py
          python scripts/41_update_readme_jesi.py
          python scripts/42_final_repository_audit.py

      - name: Save baseline A and its hashes
        run: |
          set -euo pipefail
          mkdir -p audit/master/baseline-A
          cp -a data/results/. audit/master/baseline-A/
          find audit/master/baseline-A -type f -print0 \
            | sort -z | xargs -0 -r sha256sum \
            > audit/master/baseline-A-sha256.txt

      - name: Restore frozen inputs before baseline B
        run: |
          set -euo pipefail
          rm -rf data/raw
          tar -xzf audit/master/frozen-inputs.tar.gz -C .

          python scripts/44_input_manifest.py verify \
            --manifest audit/master/input-manifest.json \
            --extra-file WEOApr2026all.xlsx

      - name: Clean generated results before baseline B
        run: |
          set -euo pipefail
          rm -rf data/results
          mkdir -p data/results

      - name: Run full Master 1.0 pipeline B
        run: |
          set -euo pipefail
          . .venv/bin/activate
          export PYTHONPATH="${GITHUB_WORKSPACE}"

          python scripts/27_score_growth.py
          python scripts/28_construct_growth_pillar.py
          python scripts/15_score_productivity_p1.py
          python scripts/19_score_productivity_p2.py
          python scripts/20_construct_productivity_pillar.py
          python scripts/22_download_connectivity_data.py
          python scripts/23_analyze_connectivity_distribution.py
          python scripts/24_score_connectivity.py
          python scripts/25_construct_connectivity_pillar.py
          python scripts/09_validate_resilience_data.py
          python scripts/10_analyze_resilience_distribution.py
          python scripts/11_score_resilience_pillar.py
          python scripts/30_validate_autonomy_data.py
          python scripts/32_validate_autonomy_data.py
          python scripts/33_analyze_autonomy_distribution.py
          python scripts/34_score_autonomy.py
          python scripts/35_construct_autonomy_pillar.py

          test -f data/processed/growth_pillar_scores_2015_2024.csv
          test -f data/processed/productivity_pillar_scores_2016_2023.csv
          test -f data/processed/connectivity_pillar_scores_2015_2024.csv
          test -f data/processed/resilience_pillar_scores_2015_2024.csv
          test -f data/processed/strategic_autonomy_pillar_2015_2024.csv

          python scripts/36_calculate_jesi.py
          python scripts/37_robustness_tests.py
          python scripts/38_generate_final_jesi_results.py
          python scripts/39_validate_final_jesi.py
          python scripts/40_generate_jesi_report.py
          python scripts/41_update_readme_jesi.py
          python scripts/42_final_repository_audit.py

      - name: Save baseline B and its hashes
        run: |
          set -euo pipefail
          mkdir -p audit/master/baseline-B
          cp -a data/results/. audit/master/baseline-B/
          find audit/master/baseline-B -type f -print0 \
            | sort -z | xargs -0 -r sha256sum \
            > audit/master/baseline-B-sha256.txt

      - name: G2 Compare baseline A and B byte-for-byte
        run: |
          set -euo pipefail
          diff -qr audit/master/baseline-A audit/master/baseline-B \
            > audit/master/baseline-A-vs-B.diff

      - name: G4 Compare fresh baseline with checked-in Master 1.0
        run: |
          set -euo pipefail
          diff -qr audit/master/checked-in-results audit/master/baseline-A \
            > audit/master/master-vs-baseline.diff

      - name: Upload Step F baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jesi-step-f-baseline
          if-no-files-found: error
          path: audit/master/

  # STEP F2: compare each candidate pytest version with the reference output.
  candidate-pipeline:
    name: F2 Candidate ${{ matrix.pytest }} Numerical Equivalence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [baseline-determinism]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pytest: ["9.0.3", "9.1.1"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Create candidate environment
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          grep -v '^pytest==' requirements.txt > /tmp/requirements-no-pytest.txt
          python -m pip install -r /tmp/requirements-no-pytest.txt
          python -m pip install "pytest==${{ matrix.pytest }}"
          python --version
          pytest --version
          python -c "import pytest; assert pytest.__version__ == '${{ matrix.pytest }}'"

      - name: Download deterministic baseline artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jesi-step-f-baseline
          path: audit/baseline

      - name: Verify and restore frozen baseline inputs
        run: |
          set -euo pipefail

          test -f audit/baseline/frozen-inputs.tar.gz
          test -f audit/baseline/frozen-inputs-archive.sha256
          test -f audit/baseline/input-manifest.json

          (
            cd audit/baseline
            sha256sum -c frozen-inputs-archive.sha256
          )

          rm -rf data/raw
          tar -xzf audit/baseline/frozen-inputs.tar.gz -C .

          python scripts/44_input_manifest.py verify \
            --manifest audit/baseline/input-manifest.json \
            --extra-file WEOApr2026all.xlsx

      - name: Clean generated results before candidate pipeline
        run: |
          set -euo pipefail
          rm -rf data/results
          mkdir -p data/results

      - name: Run full JESI candidate pipeline
        run: |
          set -euo pipefail
          . .venv/bin/activate
          export PYTHONPATH="${GITHUB_WORKSPACE}"

          python scripts/27_score_growth.py
          python scripts/28_construct_growth_pillar.py
          python scripts/15_score_productivity_p1.py
          python scripts/19_score_productivity_p2.py
          python scripts/20_construct_productivity_pillar.py
          python scripts/22_download_connectivity_data.py
          python scripts/23_analyze_connectivity_distribution.py
          python scripts/24_score_connectivity.py
          python scripts/25_construct_connectivity_pillar.py
          python scripts/09_validate_resilience_data.py
          python scripts/10_analyze_resilience_distribution.py
          python scripts/11_score_resilience_pillar.py
          python scripts/30_validate_autonomy_data.py
          python scripts/32_validate_autonomy_data.py
          python scripts/33_analyze_autonomy_distribution.py
          python scripts/34_score_autonomy.py
          python scripts/35_construct_autonomy_pillar.py

          test -f data/processed/growth_pillar_scores_2015_2024.csv
          test -f data/processed/productivity_pillar_scores_2016_2023.csv
          test -f data/processed/connectivity_pillar_scores_2015_2024.csv
          test -f data/processed/resilience_pillar_scores_2015_2024.csv
          test -f data/processed/strategic_autonomy_pillar_2015_2024.csv

          python scripts/36_calculate_jesi.py
          python scripts/37_robustness_tests.py
          python scripts/38_generate_final_jesi_results.py
          python scripts/39_validate_final_jesi.py
          python scripts/40_generate_jesi_report.py
          python scripts/41_update_readme_jesi.py
          python scripts/42_final_repository_audit.py

      - name: G6 Compare candidate with baseline A byte-for-byte
        run: |
          set -euo pipefail
          mkdir -p audit/comparison
          diff -qr audit/baseline/baseline-A data/results \
            > "audit/comparison/candidate-${{ matrix.pytest }}.diff"

      - name: Check comparison did not use tolerance-based matching
        run: |
          set -euo pipefail
          # This check examines the comparison evidence; the actual result
          # comparison above is diff -qr, which is byte-for-byte.
          if grep -RniE 'allclose|isclose|rtol|atol' audit/comparison \
            > audit/comparison/tolerance-search.txt 2>/dev/null; then
            echo "Tolerance-related expression found in comparison evidence."
            exit 1
          fi

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jesi-step-f-candidate-${{ matrix.pytest }}
          if-no-files-found: error
          path: audit/

  # Always summarize the outcome. This job is evidence-only and read-only.
  audit-summary:
    name: Step E + Step F Evidence Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: always()
    needs: [reference, compatibility, baseline-determinism, candidate-pipeline]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Generate audit summary
        run: |
          set -euo pipefail
          mkdir -p audit/summary
          {
            echo "JAS-JESI STEP E + STEP F AUDIT"
            echo "================================"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "Frozen Python baseline: 3.10"
            echo "Reference pytest: 9.0.3"
            echo "Compatibility candidates: 9.0.3, 9.1.1"
            echo "Full-pipeline candidates: 9.0.3, 9.1.1"
            echo
            echo "This workflow is read-only and produces audit evidence."
            echo "Live data sources may change between pipeline runs."
            echo "A/B or candidate byte-level differences must be investigated;"
            echo "they do not, by themselves, identify the cause."
            echo
            echo "A successful workflow run is not a final methodological judgment."
          } | tee audit/summary/STEP-E-F-AUDIT-SUMMARY.txt

      - name: Upload final audit summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jesi-step-e-f-final-summary
          if-no-files-found: error
          path: audit/summary/
