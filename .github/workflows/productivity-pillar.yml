name: Validate JESI Productivity P1 Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  productivity-p1:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Productivity P1 data
        run: |
          PYTHONPATH=. python scripts/12_download_productivity_data.py

      - name: Validate Productivity P1 data
        run: |
          PYTHONPATH=. python scripts/13_validate_productivity_data.py

      - name: Analyze Productivity P1 distribution
        run: |
          PYTHONPATH=. python scripts/14_analyze_productivity_distribution.py

      - name: Score Productivity P1
        run: |
          PYTHONPATH=. python scripts/15_score_productivity_p1.py

      - name: Upload Productivity P1 outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jesi-productivity-p1-pipeline-output
          path: |
            data/raw/productivity_p1_gdp_per_person_employed_2015_2024.csv
            data/processed/productivity_p1_pooled_descriptive_statistics.csv
            data/processed/productivity_p1_country_statistics.csv
            data/processed/productivity_p1_pooled_percentiles.csv
            data/processed/productivity_p1_country_year_extremes.csv
            data/processed/productivity_p1_candidate_reference_zones.csv
            data/processed/productivity_p1_scores_2015_2024.csv
