name: JESI Weight Sensitivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weight-sensitivity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run weight sensitivity analysis
        run: |
          python scripts/46_weight_sensitivity.py

      - name: Verify weight sensitivity outputs
        run: |
          test -s data/results/jesi_weight_sensitivity_country_year.csv
          test -s data/results/jesi_weight_sensitivity_country_summary.csv
          test -s data/results/jesi_weight_sensitivity_rank_correlations.csv
          test -s data/results/jesi_weight_sensitivity_summary.csv
          test -s data/results/jesi_weight_sensitivity_report.md

      - name: Display weight sensitivity summary
        run: |
          echo "=== Weight Sensitivity Summary ==="
          cat data/results/jesi_weight_sensitivity_summary.csv
          echo
          echo "=== Rank Correlations ==="
          cat data/results/jesi_weight_sensitivity_rank_correlations.csv

      - name: Upload weight sensitivity outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jesi-weight-sensitivity-analysis
          if-no-files-found: error
          path: |
            data/results/jesi_weight_sensitivity_country_year.csv
            data/results/jesi_weight_sensitivity_country_summary.csv
            data/results/jesi_weight_sensitivity_rank_correlations.csv
            data/results/jesi_weight_sensitivity_summary.csv
            data/results/jesi_weight_sensitivity_report.md
