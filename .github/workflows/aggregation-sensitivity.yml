name: JESI Aggregation Sensitivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aggregation-sensitivity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy openpyxl tabulate

      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/47_aggregation_sensitivity.py

      - name: Run aggregation sensitivity analysis
        run: |
          python scripts/47_aggregation_sensitivity.py

      - name: Verify aggregation sensitivity outputs
        run: |
          test -s data/results/jesi_aggregation_sensitivity_country_year.csv
          test -s data/results/jesi_aggregation_sensitivity_country_summary.csv
          test -s data/results/jesi_aggregation_sensitivity_rank_correlations.csv
          test -s data/results/jesi_aggregation_sensitivity_summary.csv
          test -s data/results/jesi_aggregation_sensitivity_report.md

          echo "All aggregation sensitivity outputs verified."

      - name: Display aggregation sensitivity summary
        run: |
          echo "=== JESI Aggregation Sensitivity Summary ==="
          cat data/results/jesi_aggregation_sensitivity_summary.csv

          echo
          echo "=== Rank Correlations ==="
          cat data/results/jesi_aggregation_sensitivity_rank_correlations.csv

          echo
          echo "=== Country Summary ==="
          cat data/results/jesi_aggregation_sensitivity_country_summary.csv

      - name: Upload aggregation sensitivity outputs
        uses: actions/upload-artifact@v4
        with:
          name: jesi-aggregation-sensitivity-analysis
          if-no-files-found: error
          path: |
            data/results/jesi_aggregation_sensitivity_country_year.csv
            data/results/jesi_aggregation_sensitivity_country_summary.csv
            data/results/jesi_aggregation_sensitivity_rank_correlations.csv
            data/results/jesi_aggregation_sensitivity_summary.csv
            data/results/jesi_aggregation_sensitivity_report.md
