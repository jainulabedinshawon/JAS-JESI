name: Run Growth Data Download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-growth-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Growth data
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/01_download_growth_data.py

      - name: Verify Growth data
        run: |
          test -f data/raw/growth_indicators_2015_2025.csv
          echo "Growth raw data file created successfully."
          wc -l data/raw/growth_indicators_2015_2025.csv

      - name: Commit Growth raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/growth_indicators_2015_2025.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add raw World Bank Growth pillar data"
            git push
          fi
