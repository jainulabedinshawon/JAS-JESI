name: Run Growth Data Download

on:
  workflow_dispatch:

jobs:
  download-growth-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Growth data
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/01_download_growth_data.py

      - name: Verify Growth data
        run: |
          test -f data/raw/growth_indicators_2015_2025.csv
          echo "Growth raw data file created successfully."
          wc -l data/raw/growth_indicators_2015_2025.csv
