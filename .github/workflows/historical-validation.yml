name: JESI Historical Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/48_historical_validation.py

      - name: Run historical validation
        run: |
          python scripts/48_historical_validation.py

      - name: Verify historical validation outputs
        run: |
          test -s data/results/jesi_historical_validation_country_year.csv
          test -s data/results/jesi_historical_validation_event_windows.csv
          test -s data/results/jesi_historical_validation_pillar_contributions.csv
          test -s data/results/jesi_historical_validation_correlations.csv
          test -s data/results/jesi_historical_validation_summary.csv
          test -s data/results/jesi_historical_validation_report.md

          echo "All historical validation outputs verified."

      - name: Display historical validation summary
        run: |
          echo "=== JESI Historical Validation Summary ==="
          cat data/results/jesi_historical_validation_summary.csv

          echo
          echo "=== External Outcome Correlations ==="
          cat data/results/jesi_historical_validation_correlations.csv

          echo
          echo "=== Historical Event Windows ==="
          cat data/results/jesi_historical_validation_event_windows.csv

          echo
          echo "=== Pillar Contribution Decomposition ==="
          cat data/results/jesi_historical_validation_pillar_contributions.csv

      - name: Upload historical validation outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jesi-historical-validation-analysis
          if-no-files-found: error
          path: |
            data/results/jesi_historical_validation_country_year.csv
            data/results/jesi_historical_validation_event_windows.csv
            data/results/jesi_historical_validation_pillar_contributions.csv
            data/results/jesi_historical_validation_correlations.csv
            data/results/jesi_historical_validation_summary.csv
            data/results/jesi_historical_validation_report.md
