name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Python path
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Validate Python syntax
        run: |
          python -m compileall -q scripts src
          echo "Python syntax validation: PASSED"

      - name: Lint
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          flake8 . \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      - name: Run tests
        run: |
          PYTHONPATH=. pytest

      - name: Download resilience data
        run: |
          python scripts/08_download_resilience_data.py

      - name: Validate resilience data
        run: |
          python scripts/09_validate_resilience_data.py

      - name: Analyze resilience distribution
        run: |
          python scripts/10_analyze_resilience_distribution.py

      - name: Download Strategic Autonomy data
        run: |
          python scripts/29_download_autonomy_data.py

      - name: Download UNCTAD import concentration data
        run: |
          python scripts/31_download_import_concentration.py

      - name: Verify UNCTAD output
        run: |
          test -f data/raw/import_product_concentration_2015_2024.csv

          python - <<'PY'
          import pandas as pd

          path = "data/raw/import_product_concentration_2015_2024.csv"
          df = pd.read_csv(path)

          if len(df) != 50:
              raise SystemExit(
                  f"Expected 50 UNCTAD observations; found {len(df)}"
              )

          print("UNCTAD output verification: PASSED")
          PY

      - name: Analyze Strategic Autonomy coverage
        run: |
          python scripts/43_analyze_autonomy_coverage.py

      - name: Upload coverage analysis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strategic-autonomy-coverage-analysis
          if-no-files-found: error
          path: data/processed/strategic_autonomy_*_2015_2024.csv
