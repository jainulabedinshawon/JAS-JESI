# This workflow installs dependencies, validates the Python code,
# runs tests, and performs the Strategic Autonomy data validation.

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    # ==============================================================
    # CHECKOUT
    # ==============================================================

    - name: Checkout repository
      uses: actions/checkout@v4

    # ==============================================================
    # PYTHON
    # ==============================================================

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    # ==============================================================
    # DEPENDENCIES
    # ==============================================================

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

        pip install flake8 pytest

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

        pip install pandas numpy scipy openpyxl requests py7zr

    # ==============================================================
    # PYTHON PATH
    # ==============================================================

    - name: Configure Python path
      run: |
        echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

    # ==============================================================
    # SYNTAX VALIDATION
    # ==============================================================

    - name: Validate Python syntax
      run: |
        python -m compileall -q scripts src
        echo "Python syntax validation: PASSED"

    # ==============================================================
    # LINT
    # ==============================================================

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

        flake8 . \
          --count \
          --exit-zero \
          --max-complexity=10 \
          --max-line-length=127 \
          --statistics

    # ==============================================================
    # TESTS
    # ==============================================================

    - name: Test with pytest
      run: |
        PYTHONPATH=. pytest

    # ==============================================================
    # RESILIENCE
    # ==============================================================

    - name: Download resilience data
      run: |
        python scripts/08_download_resilience_data.py

    - name: Validate resilience data
      run: |
        python scripts/09_validate_resilience_data.py

    - name: Analyze resilience distribution
      run: |
        python scripts/10_analyze_resilience_distribution.py

    # ==============================================================
    # STRATEGIC AUTONOMY BASE DATA
    # ==============================================================

    - name: Download Strategic Autonomy data
      run: |
        python scripts/29_download_autonomy_data.py

    # ==============================================================
    # UNCTAD IMPORT PRODUCT CONCENTRATION
    #
    # IMPORTANT:
    # Script 43 requires the official UNCTAD output
    # generated by Script 31.
    # ==============================================================

    - name: Download UNCTAD import concentration data
      run: |
        python scripts/31_download_import_concentration.py

    # ==============================================================
    # VERIFY UNCTAD OUTPUT
    # ==============================================================

    - name: Verify UNCTAD concentration output
      run: |
        test -f data/raw/import_product_concentration_2015_2024.csv

        echo "UNCTAD concentration file:"
        ls -lh data/raw/import_product_concentration_2015_2024.csv

        echo "UNCTAD concentration rows:"
        python - <<'PY'
        import pandas as pd

        path = "data/raw/import_product_concentration_2015_2024.csv"

        df = pd.read_csv(path)

        print("Rows:", len(df))
        print("Columns:", list(df.columns))

        expected_rows = 50

        if len(df) != expected_rows:
            raise SystemExit(
                f"ERROR: Expected {expected_rows} rows, found {len(df)}"
            )

        print("UNCTAD output verification: PASSED")
        PY

    # ==============================================================
    # STRATEGIC AUTONOMY COVERAGE ANALYSIS
    # ==============================================================

    - name: Analyze Strategic Autonomy coverage
      run: |
        python scripts/43_analyze_autonomy_coverage.py

    # ==============================================================
    # UPLOAD STRATEGIC AUTONOMY COVERAGE RESULTS
    # ==============================================================

    - name: Upload Strategic Autonomy coverage analysis
      uses: actions/upload-artifact@v4
      with:
        name: strategic-autonomy-coverage-analysis
        if-no-files-found: error
        path: |
          data/processed/strategic_autonomy_*_2015_2024.csv
