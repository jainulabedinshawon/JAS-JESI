name: Download JESI Growth Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-growth-data:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Growth data
        run: |
          PYTHONPATH=. python scripts/01_download_growth_data.py

      - name: Display downloaded data
        run: |
          echo "Downloaded file:"
          ls -lh data/raw/

          echo
          echo "First rows:"
          head -20 data/raw/growth_indicators_2015_2025.csv

      - name: Upload Growth dataset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jesI-growth-data-2015-2025
          path: data/raw/growth_indicators_2015_2025.csv
