name: JESI Normalization Sensitivity

on:
  workflow_dispatch:

jobs:
  normalization-sensitivity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run normalization sensitivity analysis
        run: |
          python scripts/45_normalization_sensitivity.py

      - name: Verify normalization sensitivity outputs
        run: |
          test -s data/results/jesi_normalization_sensitivity_country_year.csv
          test -s data/results/jesi_normalization_sensitivity_country_summary.csv
          test -s data/results/jesi_normalization_sensitivity_rank_correlations.csv
          test -s data/results/jesi_normalization_sensitivity_summary.csv
          test -s data/results/jesi_normalization_sensitivity_report.md

      - name: Display analysis summary
        run: |
          echo "=== Normalization Sensitivity Summary ==="
          cat data/results/jesi_normalization_sensitivity_summary.csv
          echo
          echo "=== Rank Correlations ==="
          cat data/results/jesi_normalization_sensitivity_rank_correlations.csv

      - name: Upload normalization sensitivity outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jesi-normalization-sensitivity-analysis
          path: |
            data/results/jesi_normalization_sensitivity_country_year.csv
            data/results/jesi_normalization_sensitivity_country_summary.csv
            data/results/jesi_normalization_sensitivity_rank_correlations.csv
            data/results/jesi_normalization_sensitivity_summary.csv
            data/results/jesi_normalization_sensitivity_report.md
