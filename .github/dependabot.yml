version: 2
updates:
  # Root Python dependencies — preserve Python 3.10 compatibility
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "pandas"
        update-types:
          - "version-update:semver-major"

  # Dashboard Python dependencies — preserve Python 3.10 compatibility
  - package-ecosystem: "pip"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "pandas"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
