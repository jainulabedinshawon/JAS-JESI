version: 2
updates:
  # Root Python dependencies — Preserve Python 3.10 baseline & Master 1.0 stability
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "pandas"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "numpy"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "scipy"
        update-types:
          - "version-update:semver-major"

  # Dashboard Python dependencies — Preserve Python 3.10 baseline
  - package-ecosystem: "pip"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "pandas"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "streamlit"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions dependencies — Keep workflow actions up-to-date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
